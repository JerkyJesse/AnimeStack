name: gate
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/gen-agent-dialects --check
      - run: python scripts/check-lore-consistency
