name: gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python scripts/gen-agent-dialects --check
      - run: python scripts/gen-dsh-house --check
      - run: python scripts/gen-site --check
      - run: python scripts/check-site
      - run: python scripts/check-lore-consistency
      - run: python scripts/check-board
      - run: python scripts/check-contract
      - run: python scripts/check-measurement --check-doc
      - run: python scripts/check-voices
      - run: python scripts/check-digest
      - run: python scripts/check-patterns
      - run: python scripts/check-claim --check
      - run: python scripts/seat_record --check
      - run: python scripts/room_scorecard --strict
      - run: python scripts/check-leak --tree
      - run: python -m pytest -q
      - name: setup dry run (no writes)
        run: |
          export HOME="$(mktemp -d)"
          bash setup --host all --check
          test -z "$(ls -A "$HOME")"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: setup.ps1 dry run (no writes)
        run: powershell -ExecutionPolicy Bypass -File .\setup.ps1 -TargetHost all -Check
      - run: python -m pytest tests/test_installers.py -q
