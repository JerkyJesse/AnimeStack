name: gate
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/gen-agent-dialects --check
      - run: python scripts/check-lore-consistency
      - run: python scripts/check-board
      - run: python scripts/check-contract
      - run: python scripts/check-measurement --check-doc
      - run: python scripts/check-voices
      - run: python scripts/check-digest
      - run: python -m unittest discover -s tests -v
      - name: setup dry run (no writes)
        run: |
          export HOME="$(mktemp -d)"
          bash setup --host all --check
          test -z "$(ls -A "$HOME")"
