<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="The eight-seat design loop: Mei, Elo, MechaPip, Yui, Niko, Rin, Aria, Reika">
  <rect width="900" height="520" fill="#151019"/>

  <!-- the ring -->
  <circle cx="450" cy="260" r="175" fill="none" stroke="#3a2f44" stroke-width="1"/>

  <!-- loop arrows, clockwise in seat order -->
  <polygon points="525.0,101.7 511.0,101.3 514.9,92.0" fill="#7b6a8a"/>
  <polygon points="615.0,201.1 605.4,190.9 614.6,187.1" fill="#7b6a8a"/>
  <polygon points="608.3,335.0 608.7,321.0 618.0,324.9" fill="#7b6a8a"/>
  <polygon points="508.9,425.0 519.1,415.4 522.9,424.6" fill="#7b6a8a"/>
  <polygon points="375.0,418.3 389.0,418.7 385.1,428.0" fill="#7b6a8a"/>
  <polygon points="285.0,318.9 294.6,329.1 285.4,332.9" fill="#7b6a8a"/>
  <polygon points="291.7,185.0 291.3,199.0 282.0,195.1" fill="#7b6a8a"/>
  <polygon points="391.1,95.0 380.9,104.6 377.1,95.4" fill="#7b6a8a"/>

  <!-- center -->
  <text x="450" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#E8B552">Is this still allowed to live?</text>
  <text x="450" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#b8aebf">eight seats, one spine</text>

  <!-- Mei -->
  <circle cx="450.0" cy="85.0" r="42" fill="#E276D2" fill-opacity="0.12" stroke="#E276D2" stroke-width="2"/>
  <text x="450.0" y="81.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E276D2">MEI</text>
  <text x="450.0" y="100.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#e6e0ec">climate</text>

  <!-- Elo -->
  <circle cx="573.7" cy="136.3" r="42" fill="#EEE8DC" fill-opacity="0.12" stroke="#EEE8DC" stroke-width="2"/>
  <text x="573.7" y="132.3" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#EEE8DC">ELO</text>
  <text x="573.7" y="151.3" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#e6e0ec">measurement</text>

  <!-- MechaPip -->
  <circle cx="625.0" cy="260.0" r="42" fill="#EB3B3B" fill-opacity="0.12" stroke="#EB3B3B" stroke-width="2"/>
  <text x="625.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#EB3B3B">MECHAPIP</text>
  <text x="625.0" y="275.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#e6e0ec">pattern</text>

  <!-- Yui -->
  <circle cx="573.7" cy="383.7" r="42" fill="#B28CFF" fill-opacity="0.12" stroke="#B28CFF" stroke-width="2"/>
  <text x="573.7" y="379.7" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B28CFF">YUI</text>
  <text x="573.7" y="398.7" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#e6e0ec">failure</text>

  <!-- Niko -->
  <circle cx="450.0" cy="435.0" r="42" fill="#38D2E6" fill-opacity="0.12" stroke="#38D2E6" stroke-width="2"/>
  <text x="450.0" y="431.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#38D2E6">NIKO</text>
  <text x="450.0" y="450.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#e6e0ec">body</text>

  <!-- Rin -->
  <circle cx="326.3" cy="383.7" r="42" fill="#F06A68" fill-opacity="0.12" stroke="#F06A68" stroke-width="2"/>
  <text x="326.3" y="379.7" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F06A68">RIN</text>
  <text x="326.3" y="398.7" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#e6e0ec">failure</text>

  <!-- Aria -->
  <circle cx="275.0" cy="260.0" r="42" fill="#FA8C42" fill-opacity="0.12" stroke="#FA8C42" stroke-width="2"/>
  <text x="275.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FA8C42">ARIA</text>
  <text x="275.0" y="275.0" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#e6e0ec">release</text>

  <!-- Reika -->
  <circle cx="326.3" cy="136.3" r="52" fill="#E8B552" fill-opacity="0.16" stroke="#E8B552" stroke-width="3"/>
  <text x="326.3" y="131.3" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E8B552">REIKA</text>
  <text x="326.3" y="152.3" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#e6e0ec">mandate</text>

  <!-- legend -->
  <text x="450" y="497" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" fill="#cfc7d6">MEI climate → ELO measurement → MECHAPIP pattern → YUI failure → NIKO body → RIN failure → ARIA release → REIKA mandate</text>
</svg>
